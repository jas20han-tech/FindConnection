[project]
name = "graphrag-backend"
version = "0.1.0"
description = "Graph RAG Intelligence Platform — FastAPI, ingestion, reasoning & simulation engine"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.9",
  "networkx>=3.3",
  "numpy>=1.26",
  "scipy>=1.11.0",
  "rapidfuzz>=3.9.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
llm = ["openai>=1.50.0", "tiktoken>=0.7.0"]
pdf = ["pymupdf>=1.24.0"]
graph = ["neo4j>=5.24.0"]
jobs = ["celery[redis]>=5.4.0", "redis>=5.0.0"]
postgres = ["sqlalchemy[asyncio]>=2.0.30", "asyncpg>=0.29.0"]
vectors = ["chromadb>=0.5.0"]
all = [
  "openai>=1.50.0",
  "tiktoken>=0.7.0",
  "pymupdf>=1.24.0",
  "neo4j>=5.24.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "chromadb>=0.5.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
